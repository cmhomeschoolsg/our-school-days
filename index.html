<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="School Days">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Our School Days</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Nunito:wght@500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: a schedule card for each girl — her day as a stack of tickable rows, with loop "pockets" she picks from. */
:root{
  --bg:#EEF2EC; --card:#FFFFFF; --sunk:#F5F7F3; --ink:#1C2430; --muted:#5A6573; --line:#D6DDD3;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --done:#E3F0E6; --done-ink:#245A40; --gold:#C98F12;
  --emma:#2B6390; --emily:#B23F66; --together:#2E6A4E; --warn:#B4541A;
  --who:var(--accent); --on:#FFFFFF;
  --f-display:"Alegreya", "Iowan Old Style", Georgia, serif;
  --f-body:"Nunito", "Avenir Next", system-ui, -apple-system, sans-serif;
  --f-zh:"Noto Serif SC", "Songti SC", "STSong", serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1B231F; --sunk:#161D19; --ink:#E7ECE6; --muted:#A1ACA4; --line:#2D3832;
  --accent:#6DB48D; --accent-ink:#0E1A13; --done:#1F3428; --done-ink:#9ED2B2; --gold:#E7B947;
  --emma:#82B4DD; --emily:#EC91AE; --together:#6DB48D; --warn:#F09A60; --on:#0F1612; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1B231F; --sunk:#161D19; --ink:#E7ECE6; --muted:#A1ACA4; --line:#2D3832;
  --accent:#6DB48D; --accent-ink:#0E1A13; --done:#1F3428; --done-ink:#9ED2B2; --gold:#E7B947;
  --emma:#82B4DD; --emily:#EC91AE; --together:#6DB48D; --warn:#F09A60; --on:#0F1612; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--who)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.dayline{display:flex;flex-direction:column;min-width:0}
.dayline h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.dayline .sub{color:var(--muted);font-size:15px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;height:44px;display:inline-grid;place-items:center;font-size:20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;font-size:16px}
.tab[aria-selected="true"]{background:var(--who);border-color:var(--who);color:var(--on)}
.tab.emma{--who:var(--emma)} .tab.emily{--who:var(--emily)} .tab.together{--who:var(--together)} .tab.week{--who:var(--ink)}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--who);border-radius:99px;transition:width .3s}
.banner{background:var(--card);border:1.5px solid var(--who);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner p{margin:0;min-width:0;flex:1 1 260px}
.btn{border:1.5px solid var(--who);background:var(--who);color:var(--on);border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px}
.btn.ghost{background:transparent;color:var(--who)}
.btn.small{padding:6px 12px;min-height:36px;font-size:15px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
main{display:flex;flex-direction:column;gap:22px;margin-top:6px}
.section h2{font-family:var(--f-display);font-size:23px;font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted);font-weight:700}
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.row.done{background:var(--done);background:color-mix(in srgb,var(--who) 13%,var(--card))}
.check{flex:none;width:42px;height:42px;border-radius:12px;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:900;color:transparent}
.row.done .check{background:var(--who);border-color:var(--who);color:var(--on)}
.emoji{flex:none;width:34px;text-align:center;font-size:24px;line-height:1}
.lbl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:none;border:0;padding:4px 0}
.lbl b{font-weight:800;font-size:18px}
.lbl .meta{color:var(--muted);font-size:14px}
.lbl .peek{color:var(--who);font-size:14px;font-weight:700}
.row.done .lbl b{color:var(--who)}
.open-hint{color:var(--who);font-weight:800}
.timer{flex:none;border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:64px;min-height:40px}
.timer.run{background:var(--who);border-color:var(--who);color:var(--on)}
.timer.ring{animation:ring .5s 6}
@keyframes ring{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){.timer.ring{animation:none}.progress>i{transition:none}}
.boxes{display:flex;gap:6px;flex:none}
.box{width:38px;height:38px;border-radius:10px;border:2.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--on);padding:0}
.box.f{background:var(--who);border-color:var(--who)}
.box.t{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--who)}
span.box{width:26px;height:26px;font-size:14px;border-width:2px}
.emily-mode .box{width:44px;height:44px}
@media (max-width:620px){.row{flex-wrap:wrap}.row .lbl{flex-basis:calc(100% - 130px)}.boxes{margin-left:44px}}
.mom-divider{border-top:2px dashed var(--line);padding-top:14px;margin-top:6px}
.mom-divider span{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--who)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{font-size:13px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--who);border-color:var(--who);color:var(--on)}
.loops{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.btn[disabled]{visibility:hidden}
.loop{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.loop h3{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.loop h3 span{color:var(--muted);font-weight:700}
.loop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.loop li{display:flex;gap:8px;align-items:center;font-size:15px;padding:3px 0}
.loop li.d{color:var(--muted);text-decoration:line-through}
.loop-open{border:0;background:none;padding:0;color:var(--who);font-weight:800;text-decoration:underline;text-underline-offset:3px;text-align:left}
.loop li.d .loop-open{color:var(--muted)}
.loop li .tick{width:20px;text-align:center;color:var(--who);font-weight:900}
footer.brand{margin-top:36px;text-align:center;color:var(--muted);font-family:var(--f-display);font-style:italic;font-size:15px;letter-spacing:.02em}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:860px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%;width:calc(100% - 48px)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card)}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1;min-width:0}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-body>*{flex-shrink:0}
.sheet.wide{max-width:1400px}
.bpic img{width:auto!important;max-width:100%;max-height:340px;margin:0 auto;cursor:zoom-in}
.bpic.big img{max-height:none;cursor:zoom-out}
.scm-text{white-space:pre-wrap;margin-top:6px;font-family:var(--f-serif,Georgia,serif);font-size:17px;line-height:1.5}details.vcard>summary{cursor:pointer;list-style:none}details.vcard>summary::-webkit-details-marker{display:none}
.bmaps{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.bmap{flex:1 1 320px;background:none}.bmap img{display:block;width:100%;max-width:640px;max-height:460px;object-fit:contain;object-position:left top;cursor:zoom-in;border-radius:6px}.bmap.big{flex-basis:100%}.bmap.big img{max-width:none;max-height:none;cursor:zoom-out}
.sheet-body>.seg{align-self:flex-start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{margin:0 0 6px;font-family:var(--f-display);font-size:21px}
.kicker{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--who)}
.muted{color:var(--muted)}
.small{font-size:14px}
.poem{font-family:var(--f-display);font-size:21px;line-height:1.55;white-space:pre-wrap;margin:8px 0 0;overflow-x:auto}
.emily-mode .poem{font-size:24px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zh-line{margin:14px 0 4px}
.zh-line .py{font-size:15px;color:var(--who);font-weight:700;letter-spacing:.02em}
.zh-line .hz{font-family:var(--f-zh);font-size:30px;line-height:1.5;letter-spacing:.06em}
.zh-line .en{font-size:15px;color:var(--muted);font-style:italic}
.verse-num{font-size:12px;color:var(--who);font-weight:800;vertical-align:super;margin-right:3px}
.bible-text{font-family:var(--f-display);font-size:19px;line-height:1.6}
.bible-text.zh{font-family:var(--f-zh);font-size:20px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 12px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--who);color:var(--on)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--sunk);min-width:0}
.list li.cur{outline:2px solid var(--who);background:var(--card)}
.list li span{min-width:0}
.pic img{width:100%;max-width:100%;border-radius:10px;display:block;background:var(--sunk)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs button{border:2px solid transparent;border-radius:10px;padding:0;overflow:hidden;background:var(--sunk);aspect-ratio:1;max-width:100%}
.thumbs button[aria-current="true"]{border-color:var(--who)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.goal{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px dashed var(--line)}
.goal:first-of-type{border-top:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--who)}
.dots i.f{background:var(--who)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.thumbs button{border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:0;overflow:hidden;aspect-ratio:1;cursor:pointer;color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.grid3 .col{min-width:0;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card)}
.col-h{position:sticky;top:-8px;background:var(--card);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--who);padding:4px 0;z-index:1}
@media (max-width:900px){.grid3{grid-template-columns:1fr}.grid3 .col{max-height:none}}
.sm-text{font-size:16px;line-height:1.55;white-space:pre-line}
.sm-text p{margin:0 0 10px}
.sm-h{margin:14px 0 6px;font-family:var(--f-display);font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
input[type=text],input[type=password],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.vcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.vcard .ref{font-weight:800}
.vcard.said{background:var(--done)}
.weekgrid{overflow-x:auto}
.weekgrid table{border-collapse:collapse;width:100%;font-size:14px}
.weekgrid th,.weekgrid td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
.weekgrid th:first-child,.weekgrid td:first-child{text-align:left;white-space:normal;min-width:150px}
.weekgrid td.y{color:var(--who);font-weight:900}
.empty{padding:18px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;z-index:40}
.emily-mode .lbl b{font-size:20px}
.emily-mode .check{width:48px;height:48px}
:focus-visible{outline:3px solid var(--who);outline-offset:2px}
.welcome{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.who-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.who-pick button{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:18px;text-align:left}
.who-pick button b{display:block;font-family:var(--f-display);font-size:26px}
.poem.zh.ruby{white-space:normal;line-height:1.2;font-size:20px}
.pyl{display:inline}
.py{display:inline-flex;flex-direction:column;align-items:center;min-width:1.55em;margin:0 0 .45em;vertical-align:top}
.py b{font:400 11px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted);height:1.3em;white-space:nowrap;padding:0 1px}
.py i{font-style:normal;line-height:1.35}
.py.p{min-width:.9em}
.py.vn i{font-size:11px;color:var(--muted);align-self:flex-start;padding-top:.5em}
.pyrow{margin-bottom:.15em}
.pygap{height:.9em}
.boxes.auto span.box{width:38px;height:38px;font-size:18px;border-width:2.5px}
.emily-mode .boxes.auto span.box{width:44px;height:44px}
.timer.ph{visibility:hidden}
.vs{cursor:pointer;border-radius:4px}
.vs.mk{background:color-mix(in srgb,var(--gold) 30%,transparent);box-shadow:0 0 0 2px var(--gold)}
.vs.mk::before{content:"📍";margin-right:2px}
.sp{cursor:pointer;border-radius:6px}
.sp.mk{background:color-mix(in srgb,var(--gold) 22%,transparent);box-shadow:-4px 0 0 var(--gold);padding:4px 6px}
.sp.mk::before{content:"📍 We stopped here · ";font-weight:800;color:var(--warn)}
</style>
</head>
<body>
<div id="app" class="wrap"><p class="empty">Loading your school day…</p></div>
<script src="data/content.js"></script>
<script src="data/books.js"></script>
<script src="app.js"></script>
<script type="module" src="sync.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
