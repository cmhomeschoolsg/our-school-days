<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 305" width="660" height="305" role="img" aria-label="How to make a seam and fell">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6A4E"/></marker></defs>
<rect width="660" height="305" fill="#fff"/>
<style>text{font-family:Nunito,Avenir Next,Helvetica,Arial,sans-serif;font-size:15px;fill:#2B2B2B} .h{font-weight:800;font-size:16px;fill:#2E6A4E} .m{fill:#6B6B6B;font-size:13.5px}</style>
<text x="20" y="28" text-anchor="start" class="h">Seam and fell, seen from the end</text><text x="20" y="60" text-anchor="start">a  Fold both pieces</text><path d="M30,110 L140,110 Q150,110 150,102 L118,102" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="135" text-anchor="start" class="m">one narrow fold</text><path d="M300,120 L190,120 Q180,120 180,112 L222,112 Q230,112 230,104 L200,104" fill="none" stroke="#8E6F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="145" text-anchor="start" class="m">fold, then fold again</text><text x="330" y="60" text-anchor="start">b  Wrong sides together, tack, then seam</text><path d="M340,120 L470,120 Q480,120 480,112 L450,112" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M620,104 L500,104 Q490,104 490,112 L518,112 Q526,112 526,118 L500,118" fill="none" stroke="#8E6F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M476,124 Q486,92 496,124" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M480,124 Q492,88 502,124" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="470" y="150" text-anchor="middle" class="m">seam over the edges</text><text x="20" y="200" text-anchor="start">c  Open it flat and hem down the fold over the raw edges: that is the fell</text><path d="M40,260 L300,260" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,262 L560,262" fill="none" stroke="#8E6F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300,262 Q296,248 306,246 L350,246 Q358,246 358,252 L320,252" fill="none" stroke="#8E6F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M352,244 L362,256" fill="none" stroke="#C0392B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="380" y="245" text-anchor="start" class="m">hemming stitch along the fold</text><text x="140" y="285" text-anchor="start" class="m">the raw edges are all hidden inside</text>
</svg>