<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="How to hem">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6A4E"/></marker></defs>
<rect width="660" height="340" fill="#fff"/>
<style>text{font-family:Nunito,Avenir Next,Helvetica,Arial,sans-serif;font-size:15px;fill:#2B2B2B} .h{font-weight:800;font-size:16px;fill:#2E6A4E} .m{fill:#6B6B6B;font-size:13.5px}</style>
<text x="20" y="28" text-anchor="start" class="h">Hemming (seen from the wrong side, where you work)</text><rect x="40" y="50" width="560" height="110" rx="3" fill="#F4ECDD" stroke="#A8916E" stroke-width="1.5" /><rect x="40" y="125" width="560" height="35" fill="#E6D9C2" stroke="#A8916E" stroke-width="1.5"/><line x1="40" y1="125" x2="600" y2="125" stroke="#A8916E" stroke-width="2" stroke-linecap="round" /><text x="605" y="129" text-anchor="start" class="m">fold</text><line x1="560" y1="133" x2="569" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="536" y1="133" x2="545" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="512" y1="133" x2="521" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="488" y1="133" x2="497" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="464" y1="133" x2="473" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="440" y1="133" x2="449" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="416" y1="133" x2="425" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="392" y1="133" x2="401" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="368" y1="133" x2="377" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><line x1="344" y1="133" x2="353" y2="118" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><path d="M353,118 Q330,140 311.3,132.1" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M318.8,130.9 L252.2,113.2 L238.0,112.0 L250.8,118.2 L317.2,137.1 Z" fill="#7D8590" stroke="#555" stroke-width="0.8"/><line x1="314.1" y1="132.9" x2="307.4" y2="131.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line x1="380" y1="190" x2="250" y2="190" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="390" y="195" text-anchor="start" class="m">work this way</text><text x="40" y="185" text-anchor="start" class="m">needle points to your left thumb-nail</text><text x="460" y="80" text-anchor="middle" class="m">tiny slanting stitches catch</text><text x="460" y="97" text-anchor="middle" class="m">the fabric and the fold</text><text x="20" y="232" text-anchor="start" class="h">Seen from the end: folded twice, raw edge hidden inside</text><path d="M300,300 L80,300 Q66,300 66,290 Q66,280 80,280 L170,280 Q180,280 180,286 Q180,292 170,292 L95,292" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="95" y1="292" x2="92" y2="292" stroke="#A8916E" stroke-width="3" stroke-linecap="round" /><text x="70" y="322" text-anchor="middle" class="m">edge</text><text x="185" y="322" text-anchor="middle" class="m">stitches go here</text><line x1="185" y1="308" x2="178" y2="290" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="310" y="304" text-anchor="start" class="m">fabric</text><text x="110" y="270" text-anchor="start" class="m">raw edge tucked in</text>
