<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290" role="img" aria-label="Button-hole stitch and a finished buttonhole">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6A4E"/></marker></defs>
<rect width="660" height="290" fill="#fff"/>
<style>text{font-family:Nunito,Avenir Next,Helvetica,Arial,sans-serif;font-size:15px;fill:#2B2B2B} .h{font-weight:800;font-size:16px;fill:#2E6A4E} .m{fill:#6B6B6B;font-size:13.5px}</style>
<text x="20" y="28" text-anchor="start" class="h">Button-hole stitch (shown very large)</text><rect x="40" y="70" width="330" height="140" rx="3" fill="#F4ECDD" stroke="#A8916E" stroke-width="1.5" /><line x1="40" y1="70" x2="370" y2="70" stroke="#A8916E" stroke-width="3" stroke-linecap="round" /><line x1="70" y1="72" x2="70" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="70" cy="72" r="5" fill="#C0392B"/><path d="M70,72 Q86,64 102,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="102" y1="72" x2="102" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="102" cy="72" r="5" fill="#C0392B"/><path d="M102,72 Q118,64 134,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="134" y1="72" x2="134" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="134" cy="72" r="5" fill="#C0392B"/><path d="M134,72 Q150,64 166,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="166" y1="72" x2="166" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="166" cy="72" r="5" fill="#C0392B"/><path d="M166,72 Q182,64 198,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="198" y1="72" x2="198" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="198" cy="72" r="5" fill="#C0392B"/><path d="M198,72 Q214,64 230,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="230" y1="72" x2="230" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="230" cy="72" r="5" fill="#C0392B"/><path d="M230,72 Q246,64 262,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="262" y1="72" x2="262" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="262" cy="72" r="5" fill="#C0392B"/><path d="M262,72 Q278,64 294,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="294" y1="72" x2="294" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="294" cy="72" r="5" fill="#C0392B"/><path d="M294,72 Q310,64 326,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="326" y1="72" x2="326" y2="140" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="326" cy="72" r="5" fill="#C0392B"/><path d="M326,72 Q342,64 358,72" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><text x="205" y="165" text-anchor="middle" class="m">a little knot forms on the edge;</text><text x="205" y="182" text-anchor="middle" class="m">leave one thread between stitches</text><text x="205" y="58" text-anchor="middle" class="m">the edge</text><text x="420" y="28" text-anchor="start" class="h">Then a real buttonhole</text><rect x="420" y="50" width="210" height="160" rx="3" fill="#F4ECDD" stroke="#A8916E" stroke-width="1.5" /><rect x="460" y="122" width="110" height="16" rx="8" fill="#fff" stroke="#C0392B" stroke-width="5" stroke-dasharray="2 2"/><line x1="468" y1="130" x2="562" y2="130" stroke="#8E6F4A" stroke-width="1.5" stroke-linecap="round" /><text x="525" y="165" text-anchor="middle" class="m">slit, stitched all round</text><circle cx="600" cy="250" r="22" fill="#E8D5A7" stroke="#A88B4A" stroke-width="2"/><circle cx="594" cy="244" r="2.6" fill="#A88B4A"/><circle cx="606" cy="244" r="2.6" fill="#A88B4A"/><circle cx="594" cy="256" r="2.6" fill="#A88B4A"/><circle cx="606" cy="256" r="2.6" fill="#A88B4A"/><text x="480" y="255" text-anchor="start" class="m">button sewn on</text><text x="480" y="272" text-anchor="start" class="m">firmly opposite</text>
</svg>