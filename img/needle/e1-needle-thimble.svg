<text x="20" y="28" text-anchor="start" class="h">1  Thread the needle</text><text x="20" y="48" text-anchor="start" class="m">Eye upwards, level with your chin</text><path d="M146.8,70.0 L147.4,236.0 L150.0,250.0 L152.6,236.0 L153.2,70.0 Z" fill="#7D8590" stroke="#555" stroke-width="0.8"/><line x1="150.0" y1="74.0" x2="150.0" y2="81.0" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M300,82 Q220,70 150.0,77.0 Q120,82 95,105" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><line x1="300" y1="82" x2="312" y2="84" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" /><path d="M285,110 Q230.0,76.0 175,82" fill="none" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="190" y="135" text-anchor="start" class="m">push the sharpened</text><text x="190" y="152" text-anchor="start" class="m">end through the eye</text><text x="360" y="28" text-anchor="start" class="h">2  Thimble on your middle finger</text><text x="360" y="48" text-anchor="start" class="m">Its top pushes the eye end of the needle</text><rect x="440" y="110" width="56" height="170" rx="26" fill="#F2D4B9" stroke="#C9A486" stroke-width="1.5"/><path d="M440,165 L440,128 Q440,104 468,104 Q496,104 496,128 L496,165 Z" fill="#B9BEC6" stroke="#6F7680" stroke-width="1.5"/><circle cx="448" cy="116" r="1.6" fill="#6F7680"/><circle cx="457" cy="116" r="1.6" fill="#6F7680"/><circle cx="466" cy="116" r="1.6" fill="#6F7680"/><circle cx="475" cy="116" r="1.6" fill="#6F7680"/><circle cx="484" cy="116" r="1.6" fill="#6F7680"/><circle cx="448" cy="128" r="1.6" fill="#6F7680"/><circle cx="457" cy="128" r="1.6" fill="#6F7680"/><circle cx="466" cy="128" r="1.6" fill="#6F7680"/><circle cx="475" cy="128" r="1.6" fill="#6F7680"/><circle cx="484" cy="128" r="1.6" fill="#6F7680"/><circle cx="448" cy="140" r="1.6" fill="#6F7680"/><circle cx="457" cy="140" r="1.6" fill="#6F7680"/><circle cx="466" cy="140" r="1.6" fill="#6F7680"/><circle cx="475" cy="14