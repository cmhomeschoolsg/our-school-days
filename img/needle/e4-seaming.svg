2B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M286,92 L294,80 Q296,74 299,78" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M299,78 Q262,96 261.0,105.1" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M265.2,111.5 L258.6,71.5 L254.0,58.0 L253.5,72.2 L258.8,112.5 Z" fill="#7D8590" stroke="#555" stroke-width="0.8"/><line x1="261.4" y1="108.0" x2="260.4" y2="101.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line x1="360" y1="205" x2="240" y2="205" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="370" y="210" text-anchor="start" class="m">right to left</text><text x="60" y="140" text-anchor="start" class="m">needle points straight at your chest;</text><text x="60" y="157" text-anchor="start" class="m">take up only the very edges</text><text x="430" y="65" text-anchor="middle" class="m">slanting stitches over the top</text><text x="20" y="250" text-anchor="start" class="h">Seen from the end</text><path d="M120,340 L120,282 Q120,272 130,272 L130,330" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150,340 L150,282 Q150,272 140,272 L140,330" fill="none" stroke="#A8916E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M112,282 Q135,250 158,282 L112,282" fill="none" stroke="#C0392B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="175" y="285" text-anchor="start" class="m">the thread goes over both folds</text><text x="175" y="320" text-anchor="start" class="m">front piece</text><text x="60" y="320" text-anchor="start" class="m">back</text>
