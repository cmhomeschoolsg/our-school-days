<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-label="How to back-stitch along a drawn thread">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6A4E"/></marker></defs>
<rect width="700" height="300" fill="#fff"/>
<style>text{font-family:Nunito,Avenir Next,Helvetica,Arial,sans-serif;font-size:15px;fill:#2B2B2B} .h{font-weight:800;font-size:16px;fill:#2E6A4E} .m{fill:#6B6B6B;font-size:13.5px}</style>
<text x="20" y="28" text-anchor="start" class="h">Stitching (back-stitch) on a band</text><rect x="40" y="50" width="560" height="100" rx="3" fill="#F4ECDD" stroke="#A8916E" stroke-width="1.5" /><line x1="40" y1="100" x2="600" y2="100" stroke="#CDB993" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/><text x="605" y="104" text-anchor="start" class="m">drawn thread</text><line x1="560" y1="100" x2="580" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="540" y1="100" x2="560" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="520" y1="100" x2="540" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="500" y1="100" x2="520" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="480" y1="100" x2="500" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="460" y1="100" x2="480" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="440" y1="100" x2="460" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="420" y1="100" x2="440" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="400" y1="100" x2="420" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="380" y1="100" x2="400" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="360" y1="100" x2="380" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><line x1="340" y1="100" x2="360" y2="100" stroke="#C0392B" stroke-width="3" stroke-linecap="round" /><circle cx="320" cy="100" r="4" fill="#2E6A4E"/><circle cx="340" cy="100" r="4" fill="#2E6A4E"/><path d="M320,94 Q329.0,68.0 338,94" fill="none" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="190" y="132" text-anchor="start" class="m">1  needle comes up one stitch ahead</text><text x="190" y="78" text-anchor="start" class="m">2  goes back down into the end of the last stitch</text><line x1="330" y1="180" x2="200" y2="180" stroke="#2E6A4E" stroke-width="2" marker-end="url(#ar)"/><text x="340" y="185" text-anchor="start" class="m">right to left</text><text x="20" y="225" text-anchor="start" class="h">On the back the stitches overlap, twice as long</text><rect x="40" y="240" width="560" height="40" rx="3" fill="#F4ECDD" stroke="#A8916E" stroke-width="1.5" /><line x1="580" y1="253" x2="540" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="560" y1="263" x2="520" y2="263" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="540" y1="253" x2="500" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="520" y1="263" x2="480" y2="263" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="500" y1="253" x2="460" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="480" y1="263" x2="440" y2="263" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="460" y1="253" x2="420" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="440" y1="263" x2="400" y2="263" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="420" y1="253" x2="380" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="400" y1="263" x2="360" y2="263" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" /><line x1="380" y1="253" x2="340" y2="253" stroke="#D9897F" stroke-width="3.5" stroke-linecap="round" />
</svg>