<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jom Cakap Melayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Jom Cakap Melayu, built into Our School Days. Progress is kept in the app's family data (synced), not only on this iPad. */
:root{
  --bg:#f6f4ec; --card:#fffdf6; --ink:#1f2a22; --muted:#5d6a5f;
  --pandan:#2f7a4f; --pandan-deep:#1d5636; --pandan-soft:#dcebdf;
  --gula:#8a4b22; --gula-soft:#f1e2d2; --gold:#c9962b;
  --line:#d9d6c8; --good:#2f7a4f; --again:#b5552c;
  --display:"Caprasimo", "Cooper Black", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--body);font-size:18px;line-height:1.55}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
header.band{background:var(--pandan-deep);color:#fdfbf2;position:relative}
header.band .inner{max-width:860px;margin:0 auto;padding:14px 16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.band::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;
  background:linear-gradient(135deg,var(--bg) 50%,transparent 50%) 0 0/24px 14px repeat-x,
             linear-gradient(225deg,var(--bg) 50%,transparent 50%) 0 0/24px 14px repeat-x;}
.logo{font-family:var(--display);font-size:clamp(26px,5vw,36px);line-height:1;margin:0;letter-spacing:.5px}
.logo small{display:block;font-family:var(--body);font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-top:6px}
.spacer{flex:1}
.pill{border:1.5px solid rgba(253,251,242,.5);background:transparent;color:#fdfbf2;border-radius:999px;padding:8px 16px;font-size:16px}
.pill.on{background:#fdfbf2;color:#1d5636;border-color:#fdfbf2;font-weight:700}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:28px 0 6px;text-wrap:balance}
h3{font-size:20px;margin:0 0 4px}
.lede{color:var(--muted);margin:0 0 18px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;min-height:150px}
.tile:hover{border-color:var(--pandan)}
.tile .ms{font-family:var(--display);font-size:26px;color:var(--pandan-deep)}
.tile .en{font-size:15px;color:var(--muted)}
.tile .meter{margin-top:auto;font-size:14px;color:var(--gula);font-weight:700;font-variant-numeric:tabular-nums}
.today{background:var(--gula-soft);border-radius:18px;padding:18px 20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:18px}
.today .day{font-family:var(--display);font-size:30px;color:var(--gula)}
.today ul{margin:0;padding-left:20px}
.today .txt{flex:1;min-width:220px}
.timer{display:flex;flex-direction:column;align-items:center;gap:6px}
.timer .t{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--gula)}
.btn{border:none;border-radius:14px;padding:12px 20px;background:var(--pandan);color:#fff;font-weight:700;font-size:17px;min-height:48px;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--pandan-deep);border:1.5px solid var(--pandan)}
.btn.warm{background:var(--gula)}
.btn.again{background:var(--again)}
.btn.small{padding:8px 14px;min-height:40px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{background:none;border:none;color:var(--pandan-deep);font-weight:700;padding:16px 0 0;font-size:17px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:22px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;width:100%}
.item .grow{flex:1;min-width:0}
.item .sub{font-size:15px;color:var(--muted)}
.badge{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--pandan-soft);color:var(--pandan-deep);white-space:nowrap}
.badge.todo{background:var(--gula-soft);color:var(--gula)}
.big{font-family:var(--display);font-size:clamp(28px,5vw,40px);line-height:1.25;color:var(--pandan-deep);margin:10px 0;text-wrap:balance}
.gloss{color:var(--muted);font-size:18px;min-height:1.6em}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.got{background:var(--good)}
.dot.cur{outline:2.5px solid var(--gold);outline-offset:2px}
.seg{display:inline-flex;border:1.5px solid var(--pandan);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:10px 16px;font-weight:700;color:var(--pandan-deep)}
.seg button.on{background:var(--pandan);color:#fff}
.pantun{font-family:var(--display);font-size:clamp(22px,3.6vw,30px);line-height:1.5;color:var(--pandan-deep)}
.pantun .ln{display:block;padding:4px 8px;border-radius:10px;border:none;background:none;text-align:left;width:100%;font:inherit;color:inherit}
.pantun .ln:hover{background:var(--pandan-soft)}
.pantun .ln.indent{padding-left:28px}
.blank{display:inline-block;border-bottom:3px dotted var(--gold);min-width:2.2em;color:transparent}
.src{font-size:14px;color:var(--muted);margin-top:14px}
.src a{color:var(--gula)}
.story p{max-width:62ch;margin:0 0 14px;padding:6px 10px;border-radius:10px}
.story p.reading{background:var(--gula-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:15px}
.chip b{color:var(--pandan-deep)}
textarea{width:100%;min-height:160px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:12px}
.note{background:var(--pandan-soft);border-radius:14px;padding:12px 16px;font-size:16px;color:var(--ink)}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px;font-size:20px;font-weight:700}
.opt.right{border-color:var(--good);background:var(--pandan-soft)}
.opt.wrong{border-color:var(--again)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td b{color:var(--pandan-deep)}
.phr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr .grow{flex:1;min-width:0}
.speak{border:none;background:var(--pandan-soft);color:var(--pandan-deep);border-radius:50%;width:44px;height:44px;flex:none;display:grid;place-items:center}
.speak svg{width:20px;height:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .n{font-family:var(--display);font-size:26px;color:var(--gula);font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--muted)}
.voicewarn{background:var(--gula-soft);border-radius:14px;padding:12px 16px;font-size:16px;margin-top:14px}
.brand{margin-top:40px;text-align:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.8}
.rate{display:flex;align-items:center;gap:8px;font-size:14px;color:#fdfbf2}
.rate input{accent-color:var(--gold);width:90px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<header class="band">
  <div class="inner">
    <h1 class="logo">Jom Cakap Melayu<small>Malay the Charlotte Mason way</small></h1>
    <div class="spacer"></div>
    <label class="rate" for="rate">Voice speed <input id="rate" type="range" min="0.5" max="1.1" step="0.1" value="0.8"></label>
  </div>
</header>

<main class="wrap" id="app"></main>

/* ---------------- STATE ---------------- */
// Inside Our School Days, progress lives in the app's own family data (window.parent.SDms), so it syncs between
// the iPads like everything else. Opened on its own, it falls back to this iPad's storage.
const WE = "Together";
const KEY = "jcm-v1";
let S = {active:null, kids:{}};
function bridge(){ try{ return window.parent && window.parent !== window && window.parent.SDms ? window.parent.SDms : null; }catch(e){ return null; } }
function load(){
  try{ const B = bridge(); const r = B ? B.get() : localStorage.getItem(KEY); if(r) S = JSON.parse(r); }catch(e){}
  if(!S.kids) S.kids = {};
  const fill = x=>{ ["series","pantun","stories","songs","missions"].forEach(f=>{ if(!x[f]) x[f]={}; }); if(!x.grammar) x.grammar={right:0,total:0}; if(!x.days) x.days=[]; return x; };
  // We learn Malay together now: one shared record. The first time, it is made from Emma's and Emily's
  // separate records put together (theirs are kept as they were, untouched).
  if(!S.kids[WE]){
    const parts = ["Emma","Emily"].map(n=>S.kids[n]).filter(Boolean).map(x=>fill(JSON.parse(JSON.stringify(x))));
    S.kids[WE] = parts.reduce(joinRec, blank()); S.active = WE; setTimeout(save, 0);
  }
  fill(S.kids[WE]);
  S.active = WE;
}
function joinRec(a, b){
  Object.keys(b.series).forEach(id=>{ const x=a.series[id], y=b.series[id]; if(!x){ a.series[id]=y; return; }
    const n=Math.max((x.got||[]).length,(y.got||[]).length); x.got=Array.from({length:n},(_,i)=>!!((x.got||[])[i]||(y.got||[])[i])); x.mastered=!!(x.mastered||y.mastered); });
  ["pantun","songs"].forEach(f=>Object.keys(b[f]).forEach(id=>{ a[f][id]=!!(a[f][id]||b[f][id]); }));
  Object.keys(b.missions).forEach(id=>{ if(b.missions[id] && !a.missions[id]) a.missions[id]=b.missions[id]; });
  Object.keys(b.stories).forEach(id=>{ const x=a.stories[id], y=b.stories[id]; if(!x){ a.stories[id]=y; return; }
    x.told=!!(x.told||y.told); const w=[x.written,y.written].filter(t=>t&&t.trim()); x.written=w.filter((t,i)=>w.indexOf(t)===i).join("\n\n"); });
  a.grammar.right+=b.grammar.right||0; a.grammar.total+=b.grammar.total||0;
  b.days.forEach(d=>{ if(a.days.indexOf(d)<0) a.days.push(d); }); a.days.sort();
  return a;
}
function blank(){ return {series:{}, pantun:{}, stories:{}, songs:{}, missions:{}, grammar:{right:0,total:0}, days:[]}; }
function save(){ try{ const B = bridge(); if(B) B.set(JSON.stringify(S)); else localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function me(){ return S.kids[S.active]; }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function mark(){ const k=me(); if(!k) return; const t=today(); if(k.days.indexOf(t)<0){ k.days.push(t); } save(); }

let voice = null, voiceNote = "";
function pickVoice(){
  if(!("speechSynthesis" in window)){ voiceNote="none"; return; }
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/^ms/i.test(v.lang)) || null;
  if(!voice){ const id = vs.find(v=>/^id/i.test(v.lang)); if(id){ voice=id; voiceNote="id"; } else if(vs.length){ voiceNote="none"; } }
  else voiceNote="";
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = ()=>{ pickVoice(); if(view.name==="home") render(); }; }
function rate(){ return parseFloat(document.getElementById("rate").value)||0.8; }
function say(text, onend){
  if(!("speechSynthesis" in window)){ onend&&onend(); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\.\.\./g,""));
    u.lang = voice ? voice.lang : "ms-MY"; if(voice) u.voice = voice; u.rate = rate();
    if(onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ onend&&onend(); }
}
function stop(){ try{ speechSynthesis.cancel(); }catch(e){} }

function pantunList(){

  return `<button class="back" data-go="home">‹ Home</button>
  <h2>Pantun</h2><p class="lede">A pantun has four lines. The first two paint a picture and the last two carry the meaning. Hear it, say it line by line, and learn it by heart over a week or two.</p>
  <div class="list">${PANTUN.map(p=>`<button class="item" data-go="pantun" data-id="${p.id}"><div class="grow"><h3>${p.title}</h3><div class="sub">${p.theme}</div></div><span class="badge ${k.pantun[p.id]?"":"todo"}">${k.pantun[p.id]?"By heart":"Learning"}</span></button>`).join("")}</div>`;
}
function hideWords(line, level){
  const w = line.split(" ");
  return w.map((word,j)=>{
    let hide=false;
    if(level===1) hide = j===w.length-1;
    if(level===2) hide = j%2===1 || j===w.length-1;
    if(level===3) hide = j>0;
    if(level===4) hide = true;
    if(!hide) return esc(word);
    const punct = (word.match(/[,;.]+$/)||[""])[0];
    return level===3 ? `<span class="blank" style="color:var(--muted);min-width:0">${esc(word[0])}…</span>${punct}` : `<span class="blank">${esc(word)}</span>${punct}`;
  }).join(" ");
}
function pantunView(){
  const p = PANTUN.find(x=>x.id===view.id), k = me(), lv = view.lv||0;
  const labels = ["Full text","Hide last words","Hide half","First letters","Say it all"];
  return `<button class="back" data-go="pantunList">‹ All pantun</button>

    <div class="row" style="margin-top:14px"><button class="btn" data-act="sayAll">Dengar semua</button><button class="btn ghost" data-act="toggleEn">${view.showEn?"Hide":"Show"} meaning</button></div>

/* ---- Grammar ---- */
function variants(root, suf){
  const out = [];
  ["me","mem","men","meng","meny"].forEach(px=>{ [px+root+suf, px+root.slice(1)+suf].forEach(x=>{ if(out.indexOf(x)<0) out.push(x); }); });
  return out;
}
function newQ(){
  const k = me();
  const started = SERIES.filter(s=>k.series[s.id] && k.series[s.id].got && k.series[s.id].got.some(Boolean)).map(s=>s.id);
  const pool = VERBS.filter(v=>started.indexOf(v[0])>=0);
  if(!pool.length) return null;
  const v = pool[Math.floor(Math.random()*pool.length)];
  const s = SERIES.find(x=>x.id===v[0]);
  const line = s.lines.find(l=>l[0].indexOf(v[3])>=0);
  const wrong = variants(v[1],v[2]).filter(x=>x!==v[3]).sort(()=>Math.random()-.5).slice(0,2);
  return {v, line, opts:[v[3]].concat(wrong).sort(()=>Math.random()-.5), picked:null};
}
function grammar(){
  const k = me();
  if(view.q===undefined) view.q = newQ();
  const q = view.q;
  let practice;
  if(!q) practice = `<p class="note">Practice uses only verbs from series you have started, so you work with words you already say. Start a series first, then come back.</p>`;
  else {
    const blanked = q.line[0].replace(q.v[3], "_____");
    practice = `<p style="color:var(--muted);margin:0">Root word: <b style="color:var(--ink)">${q.v[1]}${q.v[2]?" + -"+q.v[2]:""}</b> (${q.v[4]})</p>
      <div class="big" style="font-size:clamp(24px,4vw,32px)">${q.picked?q.line[0]:blanked}</div>
      <div class="opts">${q.opts.map(o=>{ let c=""; if(q.picked){ if(o===q.v[3]) c="right"; else if(o===q.picked) c="wrong"; }
        return `<button class="opt ${c}" data-act="pick" data-o="${o}" ${q.picked?"disabled":""}>${o}</button>`; }).join("")}</div>
      ${q.picked?`<p class="note" style="margin-top:12px">${q.picked===q.v[3]?"Betul! ":"Not quite. "}${q.v[1]} → <b>${q.v[3]}</b>. ${rule(q.v[1])}</p>
      <div class="row"><button class="btn" data-act="nextQ">Next sentence</button>${spk(q.line[0])}</div>`:""}`;
  }
  return `<button class="back" data-go="home">‹ Home</button>
  <h2>Tatabahasa</h2><p class="lede">Grammar comes after you can speak. These pages explain sentences you already know from the series. Best begun once a few series feel easy.</p>
  <div class="card">
    <h3>The me- prefix</h3>
    <p style="margin:6px 0 12px">Most action words in your series start with <b>me-</b>. Its ending changes to suit the first sound of the root word, and some first letters drop away.</p>
    <div class="table-wrap"><table>
      <tr><th>Root starts with</th><th>Prefix</th><th>From your series</th></tr>
      <tr><td>b, f, v</td><td><b>mem-</b></td><td>buka → <b>membuka</b>, bawa → <b>membawa</b></td></tr>
      <tr><td>p (p drops)</td><td><b>mem-</b></td><td>pilih → <b>memilih</b>, pandang → <b>memandang</b></td></tr>
      <tr><td>d, c, j, z</td><td><b>men-</b></td><td>cari → <b>mencari</b></td></tr>
      <tr><td>t (t drops)</td><td><b>men-</b></td><td>tutup → <b>menutup</b>, tunggu → <b>menunggu</b></td></tr>
      <tr><td>vowel, g, h, kh</td><td><b>meng-</b></td><td>ambil → <b>mengambil</b>, gosok → <b>menggosok</b>, isi → <b>mengisi</b></td></tr>
      <tr><td>k (k drops)</td><td><b>meng-</b></td><td>keluar → <b>mengeluarkan</b></td></tr>
      <tr><td>s (s drops)</td><td><b>meny-</b></td><td>siram → <b>menyiram</b>, sikat → <b>menyikat</b></td></tr>
      <tr><td>l, m, n, r, w, y, ng, ny</td><td><b>me-</b></td><td>lihat → <b>melihat</b>, letak → <b>meletakkan</b></td></tr>
    </table></div>
    <h3 style="margin-top:18px">The -kan ending</h3>
    <p style="margin:6px 0">-kan often means making something happen to an object. <b>keluar</b> (go out) becomes <b>mengeluarkan</b> (take something out). <b>masuk</b> (go in) becomes <b>memasukkan</b> (put something in).</p>
    <h3 style="margin-top:18px">The ber- prefix</h3>
    <p style="margin:6px 0">ber- usually describes doing an activity, often with no object. You know <b>berjalan</b> (walk) and <b>bertanya</b> (ask) from the market series.</p>
  </div>
  <h3 style="margin-top:24px">Practice: fill in the verb</h3>
  <div class="card" style="margin-top:10px">${practice}</div>
  <p class="src">${k.grammar.right} correct out of ${k.grammar.total} tries.</p>`;
}
function rule(root){
  const c = root[0];
  if("bfv".indexOf(c)>=0) return "Roots starting with b take mem-.";
  if(c==="p") return "Roots starting with p take mem-, and the p drops.";
  if("dcjz".indexOf(c)>=0) return "Roots starting with d, c or j take men-.";
  if(c==="t") return "Roots starting with t take men-, and the t drops.";
  if(c==="k") return "Roots starting with k take meng-, and the k drops.";
  if(c==="s") return "Roots starting with s take meny-, and the s drops.";
  if("aeiouhg".indexOf(c)>=0) return "Roots starting with a vowel, g or h take meng-.";
  return "Roots starting with l, m, n, r, w or y take plain me-.";
}

let timerId=null, timeLeft=600;
function tick(){ const el=document.getElementById("tm"); if(el) el.textContent = String(Math.floor(timeLeft/60)).padStart(2,"0")+":"+String(timeLeft%60).padStart(2,"0"); }

let storyRun = 0;
function readStory(s){
  const run = ++storyRun; view.playing = true; render();
  let j = 0;
  const nextPara = ()=>{
    if(run!==storyRun) return;
    document.querySelectorAll(".story p").forEach(p=>p.classList.remove("reading"));
    if(j>=s.paras.length){ view.playing=false; render(); return; }
    const el = document.getElementById("p"+j); if(el) el.classList.add("reading");
    say(s.paras[j++], nextPara);
  };
  nextPara();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button, a"); if(!t) return;
  if(t.dataset.say){ say(t.dataset.say); return; }
  if(t.dataset.go){ go({name:t.dataset.go, id:t.dataset.id}); return; }
  if(t.id==="tmb"){
    if(timerId){ clearInterval(timerId); timerId=null; timeLeft=600; tick(); t.textContent="Start 10-minute lesson"; return; }
    mark(); t.textContent="Stop";
    timerId = setInterval(()=>{ timeLeft--; tick(); if(timeLeft<=0){ clearInterval(timerId); timerId=null; timeLeft=600; const b=document.getElementById("tmb"); if(b) b.textContent="Start 10-minute lesson"; const m=document.getElementById("tm"); if(m) m.textContent="Tamat!"; } },1000);
    return;
  }
  const a = t.dataset.act; if(!a) return;
  const k = me();
  if(view.name==="series"){
    const s = SERIES.find(x=>x.id===view.id), st = k.series[s.id], i = view.i||0;
    const curText = ()=>{ const L=s.lines[view.i||0], st2=L[2]||[], si=view.step||0; return (view.mode||"learn")==="learn" && si<st2.length ? st2[si][0] : L[0]; };
    if(a==="sayLine") say(curText());
    if(a==="toggleEn") view.showEn = !view.showEn;
    if(a==="next"){
      const steps = s.lines[i][2]||[], si = view.step||0;
      if(si < steps.length) view.step = si+1; else { view.i = (i+1)%s.lines.length; view.step = 0; }
      say(curText());
    }
    if(a==="prev"){
      const si = view.step||0;
      if(si>0) view.step = si-1; else if(i>0){ view.i = i-1; view.step = (s.lines[i-1][2]||[]).length; }
      say(curText());
    }
    if(a==="mode"){ view.mode = t.dataset.m; view.i=0; view.step=0; view.reveal=false; view.showEn=false; }
    if(a==="reveal"){ view.reveal = true; say(s.lines[i][0]); }
    if(a==="got"||a==="again"){
      st.got[i] = a==="got"; mark();
      if(st.got.every(Boolean)) st.mastered = true;
      view.i = (i+1)%s.lines.length; view.reveal=false; save();
    }
    if(a!=="sayLine" && a!=="reveal") { mark(); render(); } else if(a==="reveal") render();
    return;
  }
  if(view.name==="pantun"){
    const p = PANTUN.find(x=>x.id===view.id);
    if(a==="sayAll") say(p.lines.join(" "));
    if(a==="toggleEn"){ view.showEn=!view.showEn; render(); }
    if(a==="lv"){ view.lv = +t.dataset.lv; mark(); render(); }
    if(a==="learned"){ k.pantun[p.id] = !k.pantun[p.id]; mark(); save(); render(); }
    return;
  }
  if(view.name==="story"){
    const s = STORIES.find(x=>x.id===view.id);
    if(a==="readStory"){ if(view.playing){ storyRun++; stop(); view.playing=false; render(); } else { mark(); readStory(s); } }
    if(a==="toggleText"){ view.showText=!view.showText; render(); }
    if(a==="told"){ k.stories[s.id].told = !k.stories[s.id].told; mark(); save(); render(); }
    return;
  }
  if(a==="song"){ k.songs[t.dataset.id] = !k.songs[t.dataset.id]; mark(); save(); render(); return; }
  if(a==="mission"){ k.missions[t.dataset.id] = new Date().toLocaleDateString("en-SG",{day:"numeric",month:"short"}); mark(); save(); render(); return; }
  if(view.name==="grammar"){
    if(a==="pick" && view.q && !view.q.picked){ view.q.picked = t.dataset.o; k.grammar.total++; if(t.dataset.o===view.q.v[3]) k.grammar.right++; mark(); save(); render(); }
    if(a==="nextQ"){ view.q = newQ(); render(); }
  }
});
let narTimer = null;
document.addEventListener("input", e=>{
  const id = e.target.dataset && e.target.dataset.nar;
  if(id){ const k=me(); if(!k.stories[id]) k.stories[id]={told:false,written:""}; k.stories[id].written = e.target.value; clearTimeout(narTimer); narTimer = setTimeout(save, 600); }
});
try{ const r = localStorage.getItem("jcm-rate"); if(r) document.getElementById("rate").value = r; }catch(e){}
document.getElementById("rate").addEventListener("change", e=>{ try{ localStorage.setItem("jcm-rate", e.target.value); }catch(_){} });

load(); render();
</script>
</body></html>
